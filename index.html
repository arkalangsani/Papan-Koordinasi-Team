<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Papan Koordinasi Tim</title>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --border: #e2e4e9;
    --text: #1f2430;
    --text-muted: #6b7280;
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --danger: #dc2626;
    --danger-hover: #b91c1c;
    --radius: 12px;
    --status-belum: #6b7280;
    --status-belum-bg: #eef0f3;
    --status-dikerjakan: #b45309;
    --status-dikerjakan-bg: #fef3c7;
    --status-selesai: #15803d;
    --status-selesai-bg: #dcfce7;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px 24px;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  header h1 {
    margin: 0 0 4px;
    font-size: 22px;
    font-weight: 700;
  }

  header p {
    margin: 0;
    color: var(--text-muted);
    font-size: 14px;
  }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px;
  }

  .form-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 28px;
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
  }

  .form-card h2 {
    margin: 0 0 16px;
    font-size: 16px;
    font-weight: 600;
  }

  form {
    display: grid;
    grid-template-columns: 2fr 1.5fr 1.2fr auto;
    gap: 12px;
    align-items: end;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
  }

  input, select {
    font-family: inherit;
    font-size: 14px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s ease;
  }

  input:focus, select:focus {
    border-color: var(--primary);
  }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
  }

  .btn-primary {
    background: var(--primary);
    color: #fff;
    padding: 10px 20px;
    white-space: nowrap;
  }

  .btn-primary:hover {
    background: var(--primary-hover);
  }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }

  .column {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    min-height: 120px;
  }

  .column-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }

  .column-header h3 {
    margin: 0;
    font-size: 14px;
    font-weight: 700;
  }

  .column-header .count {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    background: var(--bg);
    border-radius: 999px;
    padding: 2px 9px;
  }

  .column[data-status="Belum Mulai"] .column-header h3 { color: var(--status-belum); }
  .column[data-status="Dikerjakan"] .column-header h3 { color: var(--status-dikerjakan); }
  .column[data-status="Selesai"] .column-header h3 { color: var(--status-selesai); }

  .task-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .task-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
  }

  .task-card .task-name {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 4px;
    word-break: break-word;
  }

  .task-card .task-pic {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  .task-card .task-pic::before {
    content: "👤 ";
  }

  .task-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .task-actions select {
    flex: 1;
    padding: 6px 8px;
    font-size: 13px;
  }

  .btn-delete {
    background: transparent;
    color: var(--danger);
    border: 1px solid var(--border);
    padding: 6px 10px;
    font-size: 13px;
    line-height: 1;
  }

  .btn-delete:hover {
    background: var(--danger);
    color: #fff;
    border-color: var(--danger-hover);
  }

  .empty-state {
    color: var(--text-muted);
    font-size: 13px;
    text-align: center;
    padding: 20px 8px;
  }

  footer {
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    padding: 24px;
  }

  @media (max-width: 720px) {
    form {
      grid-template-columns: 1fr;
    }
    .board {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>

<header>
  <h1>📋 Papan Koordinasi Tim</h1>
  <p>Lihat siapa mengerjakan apa, tanpa scroll chat WhatsApp.</p>
</header>

<main>
  <section class="form-card">
    <h2>Tambah Tugas Baru</h2>
    <form id="task-form">
      <div class="field">
        <label for="task-name">Nama Tugas</label>
        <input type="text" id="task-name" placeholder="Contoh: Desain banner promo" required />
      </div>
      <div class="field">
        <label for="task-pic">Penanggung Jawab</label>
        <input type="text" id="task-pic" placeholder="Contoh: Dina" required />
      </div>
      <div class="field">
        <label for="task-status">Status Awal</label>
        <select id="task-status">
          <option value="Belum Mulai">Belum Mulai</option>
          <option value="Dikerjakan">Dikerjakan</option>
          <option value="Selesai">Selesai</option>
        </select>
      </div>
      <button type="submit" class="btn-primary">+ Tambah Tugas</button>
    </form>
  </section>

  <section class="board" id="board">
    <div class="column" data-status="Belum Mulai">
      <div class="column-header">
        <h3>Belum Mulai</h3>
        <span class="count" id="count-belum">0</span>
      </div>
      <div class="task-list" id="list-belum"></div>
    </div>
    <div class="column" data-status="Dikerjakan">
      <div class="column-header">
        <h3>Dikerjakan</h3>
        <span class="count" id="count-dikerjakan">0</span>
      </div>
      <div class="task-list" id="list-dikerjakan"></div>
    </div>
    <div class="column" data-status="Selesai">
      <div class="column-header">
        <h3>Selesai</h3>
        <span class="count" id="count-selesai">0</span>
      </div>
      <div class="task-list" id="list-selesai"></div>
    </div>
  </section>
</main>

<footer>
  Data tersimpan di browser ini (localStorage) — tidak dibagikan otomatis ke anggota tim lain.
</footer>

<script>
  const STORAGE_KEY = "papan-koordinasi-tasks";
  const STATUSES = ["Belum Mulai", "Dikerjakan", "Selesai"];
  const STATUS_SLUG = {
    "Belum Mulai": "belum",
    "Dikerjakan": "dikerjakan",
    "Selesai": "selesai",
  };

  const form = document.getElementById("task-form");
  const nameInput = document.getElementById("task-name");
  const picInput = document.getElementById("task-pic");
  const statusSelect = document.getElementById("task-status");

  function loadTasks() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (err) {
      console.error("Gagal membaca data tersimpan:", err);
      return [];
    }
  }

  function saveTasks(tasks) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function render() {
    const tasks = loadTasks();

    STATUSES.forEach((status) => {
      const slug = STATUS_SLUG[status];
      const listEl = document.getElementById(`list-${slug}`);
      const countEl = document.getElementById(`count-${slug}`);
      const tasksInStatus = tasks.filter((t) => t.status === status);

      countEl.textContent = tasksInStatus.length;

      if (tasksInStatus.length === 0) {
        listEl.innerHTML = `<div class="empty-state">Belum ada tugas.</div>`;
        return;
      }

      listEl.innerHTML = tasksInStatus
        .map((task) => `
          <div class="task-card" data-id="${task.id}">
            <div class="task-name">${escapeHtml(task.name)}</div>
            <div class="task-pic">${escapeHtml(task.pic)}</div>
            <div class="task-actions">
              <select class="status-select" data-id="${task.id}">
                ${STATUSES.map(
                  (s) => `<option value="${s}" ${s === task.status ? "selected" : ""}>${s}</option>`
                ).join("")}
              </select>
              <button class="btn-delete" data-id="${task.id}" title="Hapus tugas">✕</button>
            </div>
          </div>
        `)
        .join("");
    });
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();

    const name = nameInput.value.trim();
    const pic = picInput.value.trim();
    const status = statusSelect.value;

    if (!name || !pic) return;

    const tasks = loadTasks();
    tasks.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      name,
      pic,
      status,
    });
    saveTasks(tasks);

    form.reset();
    statusSelect.value = "Belum Mulai";
    nameInput.focus();
    render();
  });

  document.getElementById("board").addEventListener("change", (e) => {
    if (!e.target.classList.contains("status-select")) return;
    const id = e.target.dataset.id;
    const newStatus = e.target.value;
    const tasks = loadTasks();
    const task = tasks.find((t) => t.id === id);
    if (task) {
      task.status = newStatus;
      saveTasks(tasks);
      render();
    }
  });

  document.getElementById("board").addEventListener("click", (e) => {
    if (!e.target.classList.contains("btn-delete")) return;
    const id = e.target.dataset.id;
    const tasks = loadTasks().filter((t) => t.id !== id);
    saveTasks(tasks);
    render();
  });

  render();
</script>

</body>
</html>
